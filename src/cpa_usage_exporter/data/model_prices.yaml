# Default model price map for cost estimation.
#
# Rates are in USD per million tokens and are matched against the `model` field
# of each usage record: exact match first, then the longest matching prefix, so
# `claude-sonnet-4-5-20250929` resolves against the `claude-sonnet-4-5` entry.
#
# These are published list prices and drift. Override with your own file via
# `pricing.path` / CPA_PRICING_PATH; entries there replace matching keys and add
# new ones. Set `pricing.fallback_to_bundled: false` to ignore this file
# entirely and use only your own.
#
# Requests served by an OAuth subscription credential are not metered per token
# by the provider, so treat the resulting cost series as a notional
# "what this traffic would have cost on the API" figure, not an invoice.
#
# Keys per model:
#   input        prompt tokens that were not served from cache
#   output       completion tokens (reasoning tokens are billed as output
#                unless an explicit `reasoning` rate is given)
#   cache_read   cache-hit prompt tokens
#   cache_write  tokens written into the prompt cache

models:
